<!DOCTYPE html>
<html >
<head>
<meta charset="UTF-8">
<title>Sketch Layout</title>
<style>
 

  .container {
    width: 900px;
    height: 500px;
    margin: 40px auto;
    position: relative;
    background: white;
    border: 3px black;
    border-radius: 10px;
  }


  .blue {
    position: absolute;
    width: 60px;
    height: 40px;
    background:blue;
    border-radius: 6px;
  }

  
  .b1 { top: 60px; left: 80px; }
  .b2 { top: 50px; left: 400px; }
  .b3 { top: 55px; right: 80px; }

 
  .red {
    position: absolute;
    width: 60px;
    height: 40px;
    background: red;
    border-radius: 6px;
    bottom: 20px;
  }

  .r1 { left: 60px; }
  .r2 { left: 140px; }
  .r3 { left: 380px; }
  .r4 { right: 140px; }
  .r5 { right: 60px; }

</style>
</head>
<body>

<div class="container">

  
  <div class="blue b1"></div>
  <div class="blue b2"></div>
  <div class="blue b3"></div>

  
  <div class="red r1"></div>
  <div class="red r2"></div>
  <div class="red r3"></div>
  <div class="red r4"></div>
  <div class="red r5"></div>

</div>

</body>
</html>
