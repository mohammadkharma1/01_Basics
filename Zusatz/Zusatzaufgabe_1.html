<!DOCTYPE html>
<html>
<head>
<style>
 
  

  .container {
    width: 500px;
    height: 300px;
    border: 2px solid black;
    margin: 50px auto;
    position: relative;
  }

  .middle-box {
    width: 300px;
    height: 80px;
    border: 2px solid black;
    margin: 50px auto;
    display: flex;
    justify-content: space-around;
    align-items: center;
  }

  .green {
    width: 40px;
    height: 30px;
    background: green;
  }

  .blue {
    width: 50px;
    height: 50px;
    background: blue;
    position: absolute;
    bottom:0px
  }

  .left { left: 0px; }
  .right { right: 0px; }
</style>
</head>
<body>

<div class="container">
  <div class="middle-box">
    <div class="green"></div>
    <div class="green"></div>
    <div class="green"></div>
    <div class="green"></div>
  </div>

  <div class="blue left"></div>
  <div class="blue right"></div>
</div>

</body>
</html>
